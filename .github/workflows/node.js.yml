name: Node.js CI

on:
  push:
    branches: ["main"]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # upload build artifact
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: landing-build
          path: build/


  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: landing-build
          path: build

      - name: Deploy
        run: |
          sudo rm -rf /var/www/landing/*
          sudo cp -r build/* /var/www/landing/
